<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro (nivel 1: validación nativa)</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main>
    <h1>Crear cuenta</h1>

    <!-- Sin novalidate y sin JavaScript: valida el navegador -->
    <form id="registro" action="https://jsonplaceholder.typicode.com/posts" method="post">

      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input id="nombre" name="nombre" type="text"
               required minlength="3" maxlength="60" autocomplete="name">
      </div>

      <div class="campo">
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" required autocomplete="email">
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password"
               required minlength="8"
               pattern="(?=.*[A-Za-z])(?=.*\d).{8,}"
               title="Mínimo 8 caracteres, con al menos una letra y un número"
               autocomplete="new-password">
      </div>

      <div class="campo">
        <label for="confirmar">Confirmar contraseña</label>
        <input id="confirmar" name="confirmar" type="password" required
               autocomplete="new-password">
      </div>

      <div class="campo">
        <label for="edad">Edad</label>
        <input id="edad" name="edad" type="number" required
               min="18" max="120" step="1" inputmode="numeric">
      </div>

      <div class="campo">
        <label for="pais">País</label>
        <select id="pais" name="pais" required>
          <option value="">Elige un país</option>
          <option value="Argentina">Argentina</option>
          <option value="Bolivia">Bolivia</option>
          <option value="Chile">Chile</option>
          <option value="Colombia">Colombia</option>
          <option value="Ecuador">Ecuador</option>
          <option value="España">España</option>
          <option value="México">México</option>
          <option value="Perú">Perú</option>
          <option value="Uruguay">Uruguay</option>
          <option value="Venezuela">Venezuela</option>
        </select>
      </div>

      <div class="campo">
        <label class="casilla" for="terminos">
          <input id="terminos" name="terminos" type="checkbox" required>
          Acepto los términos y condiciones
        </label>
      </div>

      <button type="submit">Crear cuenta</button>
    </form>
  </main>
</body>
</html>
